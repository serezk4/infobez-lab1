name: Проверки
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: mkdir -p reports
      - name: Тесты API
        run: python -m pytest -v --junitxml=reports/pytest.xml
      - name: Bandit
        if: ${{ !cancelled() }}
        run: bandit -r secure_api -f json -o reports/bandit.json
      - name: pip-audit
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt --strict -f json -o reports/pip-audit.json
      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: snyk/actions/setup@master
      - name: Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p reports
          snyk test --file=requirements.txt --package-manager=pip --command=python --severity-threshold=high --json-file-output=reports/snyk.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: reports/
